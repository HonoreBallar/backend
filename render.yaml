# Render Blueprint: PostgreSQL database + Symfony backend in Docker.
# Render dashboard → New → Blueprint → select this repository.
databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
    postgresMajorVersion: "16"

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/portfolio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: TRUSTED_PROXIES
        value: 127.0.0.1,PRIVATE_SUBNETS
      # Values asked when the Blueprint is created (they depend on the Vercel URL)
      - key: DEFAULT_URI
        sync: false # e.g. https://portfolio-api.onrender.com
      - key: FRONTEND_URL
        sync: false # e.g. https://mon-portfolio.vercel.app
      - key: CORS_ALLOW_ORIGIN
        sync: false # e.g. ^https://mon-portfolio\.vercel\.app$
      - key: REVALIDATE_SECRET
        sync: false # same value as REVALIDATE_SECRET on Vercel
